services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      # FIX 1: Use the correct variable name
      MSSQL_SA_PASSWORD: "Complex_Pass_123!"
    ports:
      - "1433:1433"
    restart: always
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Complex_Pass_123!' -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./src
      dockerfile: FaultTracking.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy # Sadece ayakta olması yetmez, sağlıklı (ready) olmalı
    ports:
      - "5005:8080"  # PC port 5000 -> Container port 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development # This also fixes the Swagger issue
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TestDb;User Id=sa;Password=Complex_Pass_123!;TrustServerCertificate=True;